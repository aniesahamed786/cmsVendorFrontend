<p-dialog
  [modal]="true"
  [dismissableMask]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="false"
  [showHeader]="false"
  appendTo="body"
  [visible]="visible"
  (visibleChange)="close()"
  styleClass="vendor-location-dialog"
  [contentStyle]="{ padding: '0', overflow: 'hidden' }"
>
  <div class="vendor-location-dialog offer-form vendor-location-dialog__container">
    <div class="vendor-location-dialog__header">
      <div class="vendor-location-dialog__header-row">
        <div>
          <h2 class="vendor-location-dialog__title">
            Business Locations
          </h2>
          <p class="vendor-location-dialog__subtitle">
            Set up and manage your business branches and coordinates
          </p>
        </div>

        <button
          type="button"
          class="vendor-location-dialog__close-button"
          (click)="close()"
        >
          <i class="pi pi-times"></i>
        </button>
      </div>
    </div>

    <form class="vendor-location-dialog__body" [formGroup]="locationForm" (ngSubmit)="submit()">
      <section class="vendor-location-dialog__section">
        <div class="vendor-location-dialog__section-head">
          <div class="vendor-location-dialog__section-icon">
            <i class="pi pi-map-marker"></i>
          </div>
          <h3 class="vendor-location-dialog__section-title">Location Details</h3>
        </div>

        <div class="vendor-location-dialog__grid">
          <div class="vendor-location-dialog__field">
            <label class="vendor-location-dialog__label">
              Location Name (English)
              <span class="vendor-location-dialog__required">*</span>
            </label>
            <input
              pInputText
              type="text"
              placeholder="e.g. Khobar Branch"
              class="vendor-location-dialog__input"
              formControlName="locationNameEn"
            />
          </div>

          <div class="vendor-location-dialog__field">
            <label class="vendor-location-dialog__label">
              Location Name (Arabic)
              <span class="vendor-location-dialog__required">*</span>
            </label>
            <input
              pInputText
              type="text"
              placeholder="مثلاً فرع الخبر"
              class="vendor-location-dialog__input vendor-location-dialog__input--rtl"
              dir="rtl"
              formControlName="locationNameAr"
            />
          </div>

          <div class="vendor-location-dialog__field vendor-location-dialog__field--full">
            <label class="vendor-location-dialog__label">
              Country
              <span class="vendor-location-dialog__required">*</span>
            </label>
            <p-select
              [options]="countryOptions"
              placeholder="Select country"
              appendTo="body"
              styleClass="offer-form__field offer-form__select"
              panelStyleClass="offer-form__overlay-panel offer-form__select-panel"
              formControlName="country"
            ></p-select>
          </div>

          <div class="vendor-location-dialog__field">
            <label class="vendor-location-dialog__label">
              Region
            </label>
            <p-select
              [options]="regionOptions"
              placeholder="Select region"
              appendTo="body"
              styleClass="offer-form__field offer-form__select"
              panelStyleClass="offer-form__overlay-panel offer-form__select-panel"
              formControlName="region"
            ></p-select>
          </div>

          <div class="vendor-location-dialog__field">
            <label class="vendor-location-dialog__label">
              City
            </label>
            <p-select
              [options]="cityOptions"
              placeholder="Select city"
              appendTo="body"
              styleClass="offer-form__field offer-form__select"
              panelStyleClass="offer-form__overlay-panel offer-form__select-panel"
              formControlName="city"
            ></p-select>
          </div>

          <div class="vendor-location-dialog__field vendor-location-dialog__field--full">
            <label class="vendor-location-dialog__label">
              Address
              <span class="vendor-location-dialog__required">*</span>
            </label>
            <textarea
              pInputTextarea
              [autoResize]="true"
              rows="2"
              placeholder="e.g. 8628+CP Al Khobar"
              class="vendor-location-dialog__input"
              formControlName="address"
            ></textarea>
          </div>

          <div class="vendor-location-dialog__field vendor-location-dialog__field--full">
            <label class="vendor-location-dialog__label">
              Google Map Link
            </label>
            <input
              pInputText
              type="text"
              placeholder="https://maps.app.goo.gl/..."
              class="vendor-location-dialog__input"
              formControlName="mapLink"
            />
          </div>

          <div class="vendor-location-dialog__field vendor-location-dialog__field--full">
            <label class="vendor-location-dialog__label">
              Location Representative Name
            </label>
            <input
              pInputText
              type="text"
              placeholder="e.g. Abdullah Khaled"
              class="vendor-location-dialog__input"
              formControlName="locationRepresentativeName"
            />
          </div>

          <div class="vendor-location-dialog__field vendor-location-dialog__field--full">
            <label class="vendor-location-dialog__label">
              Location Phone Number
            </label>
            <input
              pInputText
              type="text"
              placeholder="e.g. +966 (13) 123 4567"
              class="vendor-location-dialog__input"
              formControlName="locationPhone"
            />
          </div>
        </div>
      </section>

      <div class="vendor-location-dialog__footer">
        <app-cancel-button (click)="close()"></app-cancel-button>

        <app-button type="submit" icon="pi pi-check">Save Location</app-button>
      </div>
    </form>
  </div>
</p-dialog>
