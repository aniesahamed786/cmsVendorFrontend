<div class="inprogress">
  <p-card class="inprogress__card">
    <div class="inprogress__body">
      <div class="inprogress__icon-circle">
        <i class="pi pi-clock inprogress__icon"></i>
      </div>
      <div class="inprogress__text">
        <h2 class="inprogress__title">
          {{ displayTitle() }} — Phase 2
        </h2>
        <p class="inprogress__subtitle">
          This feature will be implemented in phase 2.
        </p>
      </div>
      <p-tag value="Coming soon" severity="info"></p-tag>
    </div>
  </p-card>
</div>
