<div class="field-dropdown">
  <label class="field-dropdown__label">
    {{ label }}
    @if (required) {
      <span class="field-dropdown__required">*</span>
    }
  </label>
  @if (multiple) {
    <p-multiSelect
      [options]="categories()"
      [formControl]="control"
      optionLabel="name"
      optionValue="id"
      [placeholder]="placeholder"
      display="chip"
      class="field-dropdown__control"
      styleClass="offer-form__field offer-form__multiselect"
      panelStyleClass="offer-form__overlay-panel offer-form__multiselect-panel"
      appendTo="body">
    </p-multiSelect>
  } @else {
    <p-select
      [options]="categories()"
      [formControl]="control"
      optionLabel="name"
      optionValue="id"
      [placeholder]="placeholder"
      class="field-dropdown__control"
      styleClass="offer-form__field offer-form__select"
      panelStyleClass="offer-form__overlay-panel offer-form__select-panel"
      appendTo="body">
    </p-select>
  }
  @if (required && control.touched && control.hasError('required')) {
    <p class="field-dropdown__error">{{ label }} is required.</p>
  }
</div>
