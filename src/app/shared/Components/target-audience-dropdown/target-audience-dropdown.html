<div class="field-dropdown">
  <label class="field-dropdown__label">
    {{ label }}
    @if (required) {
      <span class="field-dropdown__required">*</span>
    }
  </label>
  <p-multiSelect
    [options]="options"
    [formControl]="control"
    optionLabel="label"
    optionValue="value"
    [placeholder]="placeholder"
    display="chip"
    class="field-dropdown__control"
    styleClass="offer-form__field offer-form__multiselect"
    panelStyleClass="offer-form__overlay-panel offer-form__multiselect-panel"
    appendTo="body"
  />
  @if (required && control.touched && control.hasError('required')) {
    <p class="field-dropdown__error">{{ label }} is required.</p>
  }
</div>
