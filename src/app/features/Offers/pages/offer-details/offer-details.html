<div class="offer-page-header">
  <button type="button" class="offer-page-header__back-btn" (click)="back()">
    <span class="offer-details-page-svg-icon"
      [style.webkitMaskImage]="'url(' + getOfferDetailIconPath('ic-back.svg') + ')'"
      [style.maskImage]="'url(' + getOfferDetailIconPath('ic-back.svg') + ')'"></span>
    <span>{{ 'offerDetails.back' | translate }}</span>
  </button>

  @if (isLoading()) {
  <div class="offer-page-header__actions-skeleton">
    <div class="skeleton-btn app-skeleton"></div>
    <div class="skeleton-btn app-skeleton"></div>
  </div>
  } @else {
  <div class="offer-page-header__actions">
    <app-button variant="outline" (click)="raiseTicket()">
      <span class="offer-details-page-svg-icon"
        [style.webkitMaskImage]="'url(' + getOfferDetailIconPath('ic-raise-ticket.svg') + ')'"
        [style.maskImage]="'url(' + getOfferDetailIconPath('ic-raise-ticket.svg') + ')'"></span>
      <span>{{ 'offerDetails.raiseTicket' | translate }}</span>
    </app-button>
    <app-button variant="primary" [disabled]="pendingRequest.checking()" (click)="navigateToEditOffer()">
      <span class="offer-details-page-svg-icon invert-white"
        [style.webkitMaskImage]="'url(' + getOfferDetailIconPath('ic-edit.svg') + ')'"
        [style.maskImage]="'url(' + getOfferDetailIconPath('ic-edit.svg') + ')'"></span>
      <span>{{ 'common.edit' | translate }}</span>
    </app-button>
  </div>
  }
</div>

@if (isLoading()) {
<app-offer-hero-card [loading]="true" />
<div class="offer-details-layout">
  <div class="offer-tab-panel__content">
    <div class="offer-tab-panel__main">
      <app-offer-details [loading]="true" [offer]="null"></app-offer-details>
    </div>
    <div class="offer-tab-panel__sidebar">
      <div class="preview-wrapper">
        <div class="phone-mockup">
          <div class="app-skeleton preview-skeleton__screen"></div>
        </div>
        <div class="language-toggle-container">
          <div class="app-skeleton preview-skeleton__toggle"></div>
        </div>
      </div>
    </div>
  </div>
</div>
} @else {
@if (OfferBasicData(); as offer) {
<app-offer-hero-card [offer]="offer" [vendor]="heroVendor()" />

<div class="offer-details-layout">
  <div class="offer-tab-panel__content">
    <!-- Main Content -->
    <div class="offer-tab-panel__main">
      <app-offer-details [offer]="offer" [locations]="offerLocations()"></app-offer-details>
    </div>

    <!-- Right Preview -->
    <div class="offer-tab-panel__sidebar">
      <app-preview-offer-details [offer]="offer" [vendor]="vendor()" [language]="previewLanguage()"
        [locations]="offerLocations()"></app-preview-offer-details>
    </div>
  </div>
</div>
}
}
<!-- Editing is blocked while a change request for this offer is still awaiting review — only
     one open UPDATE request is allowed per entity. -->
<app-confirmation-pop-up [visible]="!!pendingRequest.blockedBy()"
  [title]="'requestCenter.pending.title' | translate"
  [message]="pendingRequestMessage()"
  [confirmLabel]="'requestCenter.pending.viewRequest' | translate"
  [cancelLabel]="'common.cancel' | translate"
  (confirm)="pendingRequest.viewBlockingRequest()"
  (cancel)="pendingRequest.dismiss()" />
