<form [formGroup]="profileForm" class="vendor-profile-edit-form" (ngSubmit)="onUpdateChanges()">
  <div class="profile-form-section">
    <div class="profile-form-section__header">
      <div class="profile-form-section__icon"><i class="pi pi-info-circle"></i></div>
      <h2>{{ 'profile.form.basicInformation' | translate }}</h2>
    </div>
    <div class="profile-form-grid profile-form-grid--two">
      <div>
        <label>{{ 'profile.form.nameEn' | translate }} <span class="required">*</span></label>
        <input pInputText formControlName="nameEn" [placeholder]="'profile.form.placeholderNameEn' | translate" (focus)="onFocusLanguage('en')" />
      </div>
      <div>
        <label>{{ 'profile.form.nameAr' | translate }} <span class="required">*</span></label>
        <input pInputText formControlName="nameAr" class="vendor-profile-edit-form__input--rtl"
          [placeholder]="'profile.form.placeholderNameAr' | translate" (focus)="onFocusLanguage('ar')" />
      </div>
      <div class="profile-form-grid__full">
        <label>{{ 'profile.form.crNumber' | translate }}</label>
        <input pInputText formControlName="crNumber" [placeholder]="'profile.form.placeholderCrNumber' | translate" />
        <p class="field-hint">{{ 'profile.form.crNumberHint' | translate }}</p>
      </div>
      <div class="profile-form-grid__full">
        <label>{{ 'profile.form.descriptionEn' | translate }} <span class="required">*</span></label>
        <textarea pInputTextarea formControlName="descriptionEn" rows="4"
          [placeholder]="'profile.form.placeholderDescriptionEn' | translate" (focus)="onFocusLanguage('en')"></textarea>
      </div>
      <div class="profile-form-grid__full">
        <label>{{ 'profile.form.descriptionAr' | translate }} <span class="required">*</span></label>
        <textarea pInputTextarea formControlName="descriptionAr" class="vendor-profile-edit-form__input--rtl" rows="4"
          [placeholder]="'profile.form.placeholderDescriptionAr' | translate" (focus)="onFocusLanguage('ar')"></textarea>
      </div>
    </div>
  </div>

  <div class="profile-form-section">
    <div class="profile-form-section__header">
      <div class="profile-form-section__icon"><i class="pi pi-building"></i></div>
      <h2>{{ 'profile.form.businessContactDetails' | translate }}</h2>
    </div>
    <div class="profile-form-grid profile-form-grid--three">
      <div>
        <label>{{ 'profile.form.businessPhone' | translate }} <span class="required">*</span></label>
        <input pInputText formControlName="businessPhone" placeholder="+966 50 123 4567" />
      </div>
      <div>
        <label>{{ 'profile.form.businessEmail' | translate }} <span class="required">*</span></label>
        <input pInputText formControlName="businessEmail" placeholder="contact@example.com" />
      </div>
      <div>
        <label>{{ 'profile.form.businessWebsite' | translate }}</label>
        <input pInputText formControlName="businessWebsite" placeholder="https://example.com" />
      </div>
    </div>
  </div>

  <div class="profile-form-section">
    <div class="profile-form-section__header">
      <div class="profile-form-section__icon"><i class="pi pi-user"></i></div>
      <h2>{{ 'profile.form.representativeContactDetails' | translate }}</h2>
    </div>
    <div class="profile-form-grid profile-form-grid--three">
      <div>
        <label>{{ 'profile.form.repFullName' | translate }} <span class="required">*</span></label>
        <input pInputText formControlName="repFullName" [placeholder]="'profile.form.placeholderRepName' | translate" />
      </div>
      <div>
        <label>{{ 'profile.form.repPhone' | translate }} <span class="required">*</span></label>
        <input pInputText formControlName="repPhone" placeholder="+966 55 987 6543" />
      </div>
      <div>
        <label>{{ 'profile.form.repEmail' | translate }} <span class="required">*</span></label>
        <input pInputText formControlName="repEmail" placeholder="representative@example.com" />
      </div>
    </div>
  </div>

<app-vendor-location-dialog [visible]="showLocationDialog()" [locationToEdit]="selectedLocationForEdit()"
  (visibleChange)="showLocationDialog.set($event)" (saveLocation)="onLocationSaved($event)">
</app-vendor-location-dialog>
