<form [formGroup]="profileForm" class="vendor-profile-edit-form" (ngSubmit)="onUpdateChanges()">
  <div class="profile-form-section">
    <div class="profile-form-section__header">
      <div class="profile-form-section__icon"><i class="pi pi-info-circle"></i></div>
      <h2>Basic Information</h2>
    </div>
    <div class="profile-form-grid profile-form-grid--two">
      <div>
        <label>Vendor Name (English) <span class="required">*</span></label>
        <input pInputText formControlName="nameEn" placeholder="e.g. Lumee Street" />
      </div>
      <div>
        <label>Vendor Name (Arabic) <span class="required">*</span></label>
        <input pInputText formControlName="nameAr" class="vendor-profile-edit-form__input--rtl" placeholder="مثال: لومي ستريت" />
      </div>
      <div class="profile-form-grid__full">
        <label>Commercial Registration Number</label>
        <input pInputText formControlName="crNumber" placeholder="e.g. 1010456789" />
        <p class="field-hint">Required if your business is based in Saudi Arabia.</p>
      </div>
      <div class="profile-form-grid__full">
        <label>Description (English) <span class="required">*</span></label>
        <textarea pInputTextarea formControlName="descriptionEn" rows="4"
          placeholder="Briefly describe the vendor and their services"></textarea>
      </div>
      <div class="profile-form-grid__full">
        <label>Description (Arabic) <span class="required">*</span></label>
        <textarea pInputTextarea formControlName="descriptionAr" class="vendor-profile-edit-form__input--rtl" rows="4"
          placeholder="وصف مختصر للتاجر وخدماته"></textarea>
      </div>
    </div>
  </div>

  <div class="profile-form-section">
    <div class="profile-form-section__header">
      <div class="profile-form-section__icon"><i class="pi pi-building"></i></div>
      <h2>Business Contact Details</h2>
    </div>
    <div class="profile-form-grid profile-form-grid--three">
      <div>
        <label>Business Phone Number <span class="required">*</span></label>
        <input pInputText formControlName="businessPhone" placeholder="+966 50 123 4567" />
      </div>
      <div>
        <label>Business Email <span class="required">*</span></label>
        <input pInputText formControlName="businessEmail" placeholder="contact@example.com" />
      </div>
      <div>
        <label>Business Website</label>
        <input pInputText formControlName="businessWebsite" placeholder="https://example.com" />
      </div>
    </div>
  </div>

  <div class="profile-form-section">
    <div class="profile-form-section__header">
      <div class="profile-form-section__icon"><i class="pi pi-user"></i></div>
      <h2>Representative Contact Details</h2>
    </div>
    <div class="profile-form-grid profile-form-grid--three">
      <div>
        <label>Representative Full Name <span class="required">*</span></label>
        <input pInputText formControlName="repFullName" placeholder="e.g. John Doe" />
      </div>
      <div>
        <label>Representative Phone Number <span class="required">*</span></label>
        <input pInputText formControlName="repPhone" placeholder="+966 55 987 6543" />
      </div>
      <div>
        <label>Representative Email <span class="required">*</span></label>
        <input pInputText formControlName="repEmail" placeholder="representative@example.com" />
      </div>
    </div>
  </div>

  <div class="profile-form-section">
    <div class="profile-form-section__header">
      <div class="profile-form-section__icon"><i class="pi pi-map-marker"></i></div>
      <h2>Business Locations</h2>
    </div>
    <div class="profile-form-grid profile-form-grid--two">
      <div>
        <label>Location Name (English)</label>
        <input pInputText formControlName="locationNameEn" placeholder="e.g. Dammam Branch" />
      </div>
      <div>
        <label>Location Name (Arabic)</label>
        <input pInputText formControlName="locationNameAr" class="vendor-profile-edit-form__input--rtl" placeholder="مثال: فرع الدمام" />
      </div>
      <div class="profile-form-grid__full">
        <label>Country</label>
        <input pInputText formControlName="country" />
      </div>
      <div>
        <label>Region</label>
        <input pInputText formControlName="region" placeholder="e.g. Eastern Region" />
      </div>
      <div>
        <label>City</label>
        <input pInputText formControlName="city" placeholder="e.g. Khobar" />
      </div>
      <div class="profile-form-grid__full">
        <label>Address</label>
        <input pInputText formControlName="address" placeholder="Street, district, postal code" />
      </div>
      <div class="profile-form-grid__full">
        <label>Google Map Link</label>
        <input pInputText formControlName="mapLink" placeholder="https://maps.google.com/..." />
      </div>
      <div>
        <label>Location Representative Name</label>
        <input pInputText formControlName="locationRepresentativeName" />
      </div>
      <div>
        <label>Location Phone Number</label>
        <input pInputText formControlName="locationPhone" placeholder="+966 50 111 2233" />
      </div>
    </div>

    <div class="profile-form-actions-row">
      <button type="button" class="profile-link-action" (click)="addLocation()">+ Add new location</button>
    </div>

    <div class="profile-location-list">
      @for (location of savedLocations(); track location.id) {
      <div class="profile-location-item">
        <div>
          <p class="profile-location-item__title">{{ location.nameEn }}</p>
          <p class="profile-location-item__address">{{ location.address }}</p>
        </div>
        <div class="profile-location-item__actions">
          <button type="button" class="profile-link-action">Edit</button>
          <button type="button" class="profile-link-action profile-link-action--danger"
            (click)="removeLocation(location.id)">Delete</button>
        </div>
      </div>
      }
    </div>
  </div>
</form>
