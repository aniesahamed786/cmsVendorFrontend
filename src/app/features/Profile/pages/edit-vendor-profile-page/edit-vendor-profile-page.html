<div class="edit-vendor-profile-page">
  <div class="edit-profile-toolbar">
    <div class="edit-profile-toolbar__left">
      <app-back-button label="profile.backToProfile" (click)="goBack()" />
    </div>
  </div>

  <div class="edit-profile-layout">
    <div class="edit-profile-form-column" (focusin)="onFieldFocus($event)">
      <app-vendor-profile-edit-form #editFormRef [initialData]="initialData()" [isLoading]="isLoading()"
        (saveDraft)="onSaveDraft($event)" (updateChanges)="onUpdateChanges($event)"
        (languageFocus)="onLanguageFocus($event)" />

      <div class="edit-profile-form-actions">
        <app-button variant="outline" [disabled]="!canSave()" (click)="triggerSaveDraft()">
          {{ 'profile.saveAsDraft' | translate }}
        </app-button>
        <app-button variant="primary" [disabled]="!canSave()" (click)="triggerUpdateChanges()" icon="pi pi-refresh">{{ 'profile.updateChanges' | translate }}</app-button>
      </div>
    </div>

    <div class="edit-profile-preview-column">
      <app-vendor-preview #previewRef [name]="editForm()?.previewData()?.nameEn || null"
        [nameAr]="editForm()?.previewData()?.nameAr || null"
        [description]="editForm()?.previewData()?.descriptionEn || null"
        [descriptionAr]="editForm()?.previewData()?.descriptionAr || null"
        [email]="editForm()?.previewData()?.email || null" [phone]="editForm()?.previewData()?.contact || null"
        [website]="editForm()?.previewData()?.businessWebsite || null" [logo]="editForm()?.previewData()?.logo || null"
        [cover]="editForm()?.previewData()?.cover || null"
        [socialLinks]="editForm()?.previewSocialLinks() || []" [locations]="editForm()?.previewData()?.locations || []" />
    </div>
  </div>

  <app-confirmation-pop-up [visible]="showUpdateConfirm()" [loading]="isLoading()"
    [title]="'profile.confirm.title' | translate" [message]="'profile.confirm.message' | translate"
    [confirmLabel]="'profile.confirm.confirm' | translate" [cancelLabel]="'profile.confirm.cancel' | translate"
    (confirm)="onConfirmUpdate()" (cancel)="onCancelUpdate()">
  </app-confirmation-pop-up>

  <p-toast />
</div>
