<div class="mc-list">
  <!-- Search -->
  <div class="mc-list__search">
    <p-iconField iconPosition="left">
      <p-inputIcon styleClass="pi pi-search" />
      <input type="text" pInputText class="mc-list__search-input" [placeholder]="'messaging.search' | translate"
        [ngModel]="searchText()" (ngModelChange)="onSearchChange($event)" />
    </p-iconField>
  </div>

  <!-- Filters -->
  <div class="mc-list__filters">
    <div class="mc-list__field">
      <label class="mc-list__label">{{ 'messaging.label.type' | translate }}</label>
      <p-select [options]="typeOptions()" [ngModel]="selectedType()" (ngModelChange)="onTypeChange($event)"
        optionLabel="label" optionValue="value" [placeholder]="'messaging.placeholder.type' | translate" styleClass="mc-list__select"
        panelStyleClass="mc-list__panel" appendTo="body"></p-select>
    </div>

    <div class="mc-list__field">
      <label class="mc-list__label">{{ 'messaging.label.status' | translate }}</label>
      <p-select [options]="statusOptions()" [ngModel]="selectedStatus()" (ngModelChange)="onStatusChange($event)"
        optionLabel="label" optionValue="value" [placeholder]="'messaging.placeholder.status' | translate" styleClass="mc-list__select"
        panelStyleClass="mc-list__panel" appendTo="body"></p-select>
    </div>
  </div>

  <!-- Tabs -->
  <div class="mc-list__tabs">
    <button type="button" class="mc-list__tab" [class.mc-list__tab--active]="activeTab() === 'all'"
      (click)="setTab('all')">
      {{ 'messaging.all' | translate }}
    </button>
    <button type="button" class="mc-list__tab" [class.mc-list__tab--active]="activeTab() === 'unread'"
      (click)="setTab('unread')">
      {{ 'messaging.tab.unread' | translate }}
    </button>
    <button type="button" class="mc-list__tab" [class.mc-list__tab--active]="activeTab() === 'read'"
      (click)="setTab('read')">
      {{ 'messaging.tab.read' | translate }}
    </button>
  </div>

  <!-- Ticket list -->
  <div class="mc-list__cards">
    @for (ticket of tickets(); track ticket.id) {
    <button type="button" class="mc-list__card" [class.mc-list__card--selected]="ticket.id === selectedTicketId()"
      [class.mc-list__card--unread]="ticket.unread" [class.mc-list__card--status-new]="ticket.status === 'New'"
      [class.mc-list__card--status-progress]="ticket.status === 'In Progress'"
      [class.mc-list__card--status-closed]="ticket.status === 'Closed'" (click)="onSelectTicket(ticket)">
      <div class="mc-list__card-top">
        <div class="mc-list__card-meta">
          @if (ticket.unread) {
          <span class="mc-list__unread-dot" [title]="'messaging.unreadDot' | translate"></span>
          }
          <span class="mc-list__badge" [class]="statusBadgeClass(ticket.status)">{{ statusKey(ticket.status) | translate }}</span>
          <span class="mc-list__reference">{{ ticket.reference }}</span>
        </div>
        <div class="mc-list__card-right">
          <span class="mc-list__category">{{ categoryKey(ticket.category) | translate }}</span>
        </div>
      </div>

      <div class="mc-list__title">{{ ticket.title }}</div>
      <div class="mc-list__preview">{{ ticket.preview }}</div>
      <div class="mc-list__time">{{ ticket.timeAgo }}</div>
    </button>
    } @empty {
    <div class="mc-list__empty">
      <i class="pi pi-inbox"></i>
      <span>{{ 'messaging.empty' | translate }}</span>
    </div>
    }
  </div>

  <!-- New ticket button -->
  <div class="mc-list__footer">
    <button type="button" class="mc-list__new-btn" (click)="onCreateTicket()">
      <i class="pi pi-plus"></i>
      <span>{{ 'messaging.newTicket' | translate }}</span>
    </button>
  </div>
</div>
