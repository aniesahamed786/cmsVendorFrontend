<div class="login-page">

  <!-- Header -->
  <header class="header">
    <div class="logo">
      <span class="offer-text">Offer</span>
      <span class="divider">|</span>
      <span class="arabic-text">أوفر</span>
    </div>

    <div class="header-actions">
      <a href="#">
        <i class="pi pi-globe"></i>
        العربية
      </a>

      <a href="#">
        <i class="pi pi-headphones"></i>
        Support
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">

    <div class="title-section">
      <h2>Vendor Portal</h2>
      <p>Enter your credentials to access the secure portal.</p>
    </div>

    <!-- Login Card -->
    <div class="login-card">

      <form [formGroup]="loginForm" (ngSubmit)="login()">

        <!-- Business Email -->
        <div class="form-group">

          <label>Business Email</label>

          <div class="input-wrapper">

            <i class="pi pi-envelope"></i>

            <input
              type="email"
              placeholder="name@company.com"
              formControlName="email">

          </div>

        </div>

        <!-- Password -->

        <div class="form-group">

          <div class="label-row">
            <label>Password</label>

            <a href="#" class="forgot-link">
              Forgot password?
            </a>

          </div>

          <div class="input-wrapper">

            <i class="pi pi-lock"></i>

            <input
              [type]="hidePassword ? 'password' : 'text'"
              placeholder="********"
              formControlName="password">

            <button
  type="button"
  class="password-toggle"
  (click)="togglePassword()">

  <i
    class="pi"
    [ngClass]="hidePassword ? 'pi-eye' : 'pi-eye-slash'">
  </i>

</button>

          </div>

        </div>

        <!-- Remember -->

        <div class="remember-row">

          <label class="checkbox-container">

            <input
              type="checkbox"
              formControlName="remember">

            <span>Keep me signed in for 30 days</span>

          </label>

        </div>

        <!-- Login Button -->

        <button
  type="submit"
  class="login-btn"
  [disabled]="isSubmitting">

  {{ isSubmitting ? 'Signing In...' : 'Sign In' }}

  <i class="pi pi-sign-in"></i>

</button>

      </form>

      <hr>

      <div class="support-text">

        Trouble logging in?

        <a href="#">
          Contact Support
        </a>

      </div>

    </div>

    <!-- Security -->

    <div class="security-section">

      <div class="security-item">

        <i class="pi pi-shield"></i>

        <span>Enterprise Grade Security</span>

      </div>

      <div class="security-item">

        <i class="pi pi-lock"></i>

        <span>SSL Encrypted</span>

      </div>

    </div>

  </main>

  <!-- Footer -->

  <footer class="footer">

    <div class="footer-left">

      <span class="offer-text">Offer</span>

      <span class="divider">|</span>

      <span class="portal-text">Vendor Portal</span>

    </div>

    <div class="footer-center">

      <a href="#">Privacy Policy</a>

      <a href="#">Terms of Service</a>

    </div>

    <div class="footer-right">

      © 2024 Corporate Systems Inc. All rights reserved.

    </div>

  </footer>

</div>
