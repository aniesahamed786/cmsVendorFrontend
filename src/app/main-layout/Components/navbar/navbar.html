<div class="navbar-shell">
  <span class="sr-only">{{ resolvedHeader() }}</span>

  <div class="navbar-spacer"></div>

  <div class="navbar-actions" [attr.aria-label]="'navbar.toolbarActions' | translate">
    <button type="button" class="profile-trigger" [attr.aria-label]="'navbar.profileMenu' | translate" (click)="profileMenu.toggle($event)">
      <!-- No aria-label here: the wrapping button already carries one, and a
           nested label would have the avatar announced twice. -->
      <p-avatar [label]="avatarLabel()" shape="circle" styleClass="navbar-avatar" />
    </button>

    <p-popover #profileMenu styleClass="navbar-profile-popover">
      <div class="profile-menu">
        <div class="profile-menu-header">
          <p-avatar [label]="avatarLabel()" shape="circle" size="large" styleClass="profile-menu-avatar" />
          <div class="profile-menu-user">
            <p class="profile-menu-name">{{ userName() }}</p>
            <p class="profile-menu-role">{{ userRole() | translate }}</p>
          </div>
        </div>

        <div class="profile-menu-section">
          <button type="button" class="profile-menu-item" (click)="onProfile()">
            <i class="pi pi-id-card"></i>
            <span>{{ 'navbar.profile' | translate }}</span>
          </button>
          <button type="button" class="profile-menu-item" (click)="onSettings()">
            <i class="pi pi-cog"></i>
            <span>{{ 'navbar.settings' | translate }}</span>
          </button>
          <div class="profile-menu-theme">
            <div class="profile-menu-theme-label">
              <i class="pi pi-moon"></i>
              <span>{{ 'navbar.darkTheme' | translate }}</span>
            </div>
            <p-toggleswitch [ngModel]="isDarkMode()" (ngModelChange)="onThemeToggle($event)"></p-toggleswitch>
          </div>
          <button type="button" class="profile-menu-item" (click)="onLanguageToggle()">
            <i class="pi pi-globe"></i>
            @if (isArabic()) {
              <span>English</span>
            } @else {
              <span>العربية</span>
            }
          </button>
        </div>

        <div class="profile-menu-section profile-menu-section--footer">
          <button type="button" class="profile-menu-item profile-menu-logout" (click)="onLogout()">
            <i class="pi pi-sign-out"></i>
            <span>{{ 'navbar.logout' | translate }}</span>
          </button>
        </div>
      </div>
    </p-popover>
  </div>
</div>
