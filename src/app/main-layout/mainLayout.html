<main class="w-full h-screen overflow-hidden app-shell-bg">
  <div
    class="grid h-full w-full gap-0 grid-cols-1 md:grid-cols-[240px_minmax(0,1fr)] lg:grid-cols-[280px_minmax(0,1fr)]"
  >
    <app-sidenav
      class="sidenav-desktop h-full"
      (sendNavBarHeader)="handledata($event)"
    ></app-sidenav>

    <div class="w-full min-w-0 min-h-0 h-full flex flex-col app-shell-bg">
      <div class="mobile-topbar">
        <button
          pButton
          type="button"
          icon="pi pi-bars"
          class="p-button-text"
          (click)="openMobileSidebar()"
        ></button>
        <span class="mobile-topbar__title">
          {{ receivedHeaderData() || 'Dashboard' }}
        </span>
        <span class="mobile-topbar__spacer"></span>
      </div>

      <app-navbar
        class="hidden md:block shrink-0 navbar-offset"
        [headerData]="receivedHeaderData()"
      ></app-navbar>

      <div
        class="main-layout flex-1 min-h-0 overflow-y-auto px-4 py-4 mt-4 md:mt-6 md:px-6 md:py-0 md:pb-6"
      >
        <router-outlet />
      </div>
    </div>
  </div>
</main>

<p-drawer
  [visible]="mobileSidebarOpen()"
  [modal]="true"
  [blockScroll]="true"
  [dismissible]="true"
  position="left"
  styleClass="w-[86vw] max-w-[320px]"
  (visibleChange)="mobileSidebarOpen.set($event)"
>
  <app-sidenav (sendNavBarHeader)="handleMobileNav($event)"></app-sidenav>
</p-drawer>

<p-toast></p-toast>
