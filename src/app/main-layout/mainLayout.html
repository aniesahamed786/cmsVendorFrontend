<main class="app-shell app-shell-bg">
  <div class="app-shell__grid">
    <app-sidenav
      class="sidenav-desktop app-shell__sidenav"
      (sendNavBarHeader)="handledata($event)"
    ></app-sidenav>

    <div class="app-shell__content app-shell-bg">
      <div class="mobile-topbar">
        <!-- DEFERRED (Phase 1 gate): stays a pButton until <app-button> gains an
             ariaLabel input. This is icon-only, so converting it as-is would
             leave the inner <button> with no accessible name. The phase that
             next touches shared/Components/button/ should add that input and
             finish this swap. -->
        <button
          pButton
          type="button"
          icon="pi pi-bars"
          class="p-button-text"
          [attr.aria-label]="'nav.openMenu' | translate"
          (click)="openMobileSidebar()"
        ></button>
        <span class="mobile-topbar__title">
          {{ (receivedHeaderData() || 'nav.dashboard.title') | translate }}
        </span>
        <span class="mobile-topbar__spacer"></span>
      </div>

      <app-navbar
        class="app-shell__navbar"
        [headerData]="receivedHeaderData()"
      ></app-navbar>

      <div #scrollContainer class="main-layout app-shell__outlet">
        <router-outlet (activate)="scrollContainer.scrollTo(0, 0)" />
      </div>
    </div>
  </div>
</main>

<p-drawer
  [visible]="mobileSidebarOpen()"
  [modal]="true"
  [blockScroll]="true"
  [dismissible]="true"
  [position]="isRtl() ? 'right' : 'left'"
  styleClass="mobile-sidebar-drawer"
  (visibleChange)="mobileSidebarOpen.set($event)"
>
  <app-sidenav (sendNavBarHeader)="handleMobileNav($event)"></app-sidenav>
</p-drawer>

<p-toast></p-toast>
