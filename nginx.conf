server {
    listen 8081;
 
    root /usr/share/nginx/html;
    index index.html;
 
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
 
    location /api/ {
        proxy_pass http://backend:8080;
    }
}

